spring:
  application:
    name: soulh-backend
  data:
    mongodb:
      host: localhost
      port: 27017
      database: soulh_db
      # To use MongoDB Atlas in production, replace host/port with:
      # uri: mongodb+srv://<user>:<pass>@cluster.mongodb.net/soulh_db
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:soulh-super-secret-jwt-key-must-be-at-least-32-chars-long-for-hmac}
    expiration: 86400000 # 24 hours in milliseconds
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

  razorpay:
    # Use TEST mode keys — sign up free at razorpay.com → Settings → API Keys
    key-id: ${RAZORPAY_KEY_ID:rzp_test_REPLACE_WITH_YOUR_KEY}
    key-secret: ${RAZORPAY_KEY_SECRET:REPLACE_WITH_YOUR_SECRET}
    consultation-fee: 499.0   # INR — change as needed
